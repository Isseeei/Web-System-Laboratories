<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>My Playlist</title>
</head>
<body>

    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-6 col-md-12 mb-4">
                <div class="card bg-dark text-light">
                    <div class="card-header text-center bg-secondary">
                        <h3>My Playlist</h3>
                    </div>
                    <div class="card-body">
                        <div class="playlist-header d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex w-50">
                                <input type="text" class="search-bar form-control bg-dark text-light border-light" placeholder="Search for a song...">
                                <button type="submit" id="add-button" class="btn btn-primary ms-2">Search</button>
                            </div>
                        </div>
                        
    
                        <ul id="Songs" class="list-unstyled">
                            <li class="song d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <p class="song-title mb-0 text-light ">Heaven Knows</p>
                                    <small class="artist-name text-light">Orange & Lemons</small>
                                </div>
                                <button class="btn btn-danger btn-sm delete">Delete</button>
                            </li>
                            <li class="song d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <p class="song-title mb-0 text-light">Dancin'</p>
                                    <small class="artist-name text-light">Aaron Smith</small>
                                </div>
                                <button class="btn btn-danger btn-sm delete">Delete</button>
                            </li>
                            <li class="song d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <p class="song-title mb-0 text-light">When I Was Your Man</p>
                                    <small class="artist-name text-light">Bruno Mars</small>
                                </div>
                                <button class="btn btn-danger btn-sm delete">Delete</button>
                            </li>
                            <li class="song d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <p class="song-title mb-0 text-light">Espresso</p>
                                    <small class="artist-name text-light">Sabrina Carpenter</small>
                                </div>
                                <button class="btn btn-danger btn-sm delete">Delete</button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
    
            <div class="col-lg-6 col-md-12 mb-4">
                <div class="card bg-dark text-light">
                    <div class="card-header text-center bg-secondary">
                        <h3>Add Song</h3>
                    </div>
                    <div class="card-body">
                        <form id="adds">
                            <div class="mb-3">
                                <label for="song-title" class="form-label text-light">Title:</label>
                                <input type="text" id="song-title" class="form-control bg-dark text-light border-light" placeholder="Enter song title">
                            </div>
                            <div class="mb-3">
                                <label for="artist-name" class="form-label text-light">Artist:</label>
                                <input type="text" id="artist-name" class="form-control bg-dark text-light border-light" placeholder="Enter artist name">
                            </div>
                            <button type="submit" id="add-button" class="btn btn-primary">Add</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="test2.js"></script>
</body>
</html>
